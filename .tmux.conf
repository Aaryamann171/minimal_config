# ==============================================================================
# Color Palettes (VS Code Dark Modern)
# ==============================================================================
set -g @blue       "#9CDCFE"
set -g @dark_blue  "#569CD6"
set -g @yellow     "#D7BA7D"
set -g @gray       "#808080"
set -g @bg_editor  "#1F1F1F"
set -g @bg_dark    "#262626"
set -g @fg_default "#CCCCCC"
set -g @fg_active  "#FFFFFF"

# --- Expanded Palette (Future Use - Maybe) ---
set -g @purple     "#C586C0"  # Keyword/Control Flow
set -g @green      "#6A9955"  # Comments/Strings
set -g @light_red  "#D16969"  # Errors/Regex
set -g @orange     "#CE9178"  # Strings/Constants
set -g @cyan       "#4EC9B0"  # Types/Classes

# --- Terminal & General Settings ---
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g base-index 1
set -g renumber-windows on
set -g history-limit 30000
set -g status-interval 2

# --- Keybindings ---
# Prefix
unbind C-b
set -g prefix `
bind ` send-prefix

# Vim like keybinds
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# QOL
unbind '"'
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload conf bind
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# ==============================================================================
# Minimalist Status Bar Design
# ==============================================================================
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#{@bg_dark},fg=#{@fg_default}"

# Left side: Session name
set -g status-left-length 30
set -g status-left "#{?client_prefix,#[fg=#{@bg_dark} bg=#{@yellow} bold],#[fg=#{@bg_dark} bg=#{@blue} bold]} #S #[default] "

# Right side: [Username] | [Time] | [Dir]
set -g status-right-length 100
set -g status-right "#[fg=#{@dark_blue}]#{b:pane_current_path} #[fg=#{@gray}]│ #[fg=#{@blue}]#(whoami)@#{host}"

# --- Window Tabs Styling ---
setw -g window-status-separator "  "

# Inactive Windows
setw -g window-status-style "fg=#{@gray},bg=#{@bg_dark}"
setw -g window-status-format "#I #W"

# Active Window
setw -g window-status-current-style "fg=#{@fg_active},bg=#{@bg_dark},bold"
setw -g window-status-current-format "#[fg=#{@dark_blue}]#I#[fg=#{@fg_active}] #W"

# --- Pane Borders ---
set -g pane-border-style "fg=#{@bg_editor}"
set -g pane-active-border-style "fg=#{@dark_blue}"

# --- Command Line / Messages ---
set -g message-style "fg=#{@yellow},bg=#{@bg_dark},bold"
set -g message-command-style "fg=#{@yellow},bg=#{@bg_dark},bold"
